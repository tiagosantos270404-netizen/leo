<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Pedido · Léo Restaurante &amp; Lancheria</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita; topo com logo e número do pedido, linha do tempo das etapas, itens e total. Pensado para o celular do cliente.
   Identidade Léo Restaurante & Lancheria: laranja do logo sobre preto, tema escuro único. */
:root{
  /* cores da marca: altere aqui */
  --cor-primaria:#F7931E; --cor-primaria-hover:#E07B00;
  --cor-fundo:#0D0D0D; --cor-fundo-secundario:#1A1A1A; --cor-borda:#2A2A2A;
  --cor-texto:#FFFFFF; --cor-texto-secundario:#BDBDBD;
  --cor-sucesso:#2ECC71; --cor-erro:#E74C3C;
  /* apelidos usados no resto do código */
  --brand:var(--cor-fundo-secundario); --brasa:var(--cor-primaria); --brasa-ink:#0D0D0D; --carvao:var(--cor-texto); --bg:var(--cor-fundo); --surface:var(--cor-fundo-secundario); --surface-2:#242424; --line:var(--cor-borda); --muted:var(--cor-texto-secundario);
  --ok:var(--cor-sucesso); --ok-bg:rgba(46,204,113,.14); --warn:#F7B55E; --warn-bg:rgba(247,147,30,.13); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif; --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--carvao);font:16px/1.5 var(--f-body)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--cor-primaria);outline-offset:2px}
header{background:var(--brand);color:var(--cor-texto);border-bottom:1px solid var(--cor-borda);padding-block:calc(14px + env(safe-area-inset-top,0px)) 26px}
header .inner{display:grid;gap:14px}
.logo{display:inline-flex;align-items:center;justify-self:start}
.logo img{height:56px;width:auto;display:block}
@media (max-width:640px){.logo img{height:44px}}
header h1{font-size:34px;font-weight:700;color:var(--cor-primaria)}
header p{color:var(--cor-texto-secundario)}
main{padding-block:18px 60px}
main .inner{display:grid;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px}
.card h2{font-size:18px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:700;color:#0D0D0D;position:relative;z-index:1}
.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.done::before{background:var(--ok)}
.steps li.now .dot{background:var(--brasa);border-color:var(--brasa);box-shadow:0 0 0 5px color-mix(in srgb,var(--brasa) 22%,transparent)}
.steps b{display:block}
.steps small{color:var(--muted);font-size:14px}
.steps li.todo b{color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.line small{grid-column:1/-1;color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--f-display);font-weight:700;font-size:22px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--carvao);font:700 16px var(--f-body);cursor:pointer;text-decoration:none;width:100%}
.btn-primary{background:var(--brasa);border-color:var(--brasa);color:var(--brasa-ink)}
.btn-primary:hover:not(:disabled){background:var(--cor-primaria-hover);border-color:var(--cor-primaria-hover)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.err{color:var(--cor-erro);font-weight:600}
.pixcode{font:500 13px/1.4 ui-monospace,Consolas,monospace;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);max-height:84px;overflow:auto}
.pixamount{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--cor-primaria)}
.pixqr{justify-self:center;width:min(260px,100%);background:#fff;border-radius:14px;padding:6px}
.pixqr svg{display:block;width:100%;height:auto}
.demo{background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14px;padding:10px 14px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="gut">
  <div class="inner">
    <a class="logo" href="/" title="Página inicial"><img src="img/logo-sm.png" alt="Léo Restaurante &amp; Lancheria" width="52" height="56"></a>
    <div><p id="kicker">Seu pedido</p><h1 id="title">Carregando…</h1></div>
    <p id="subtitle"></p>
    <p class="okmsg" id="lunchWhen" hidden style="font-size:17px"></p>
  </div>
</header>
<main class="gut"><div class="inner">
  <p class="demo" id="demo" hidden>Modo demonstração: pedido de exemplo. No site do Léo esta página mostra o pedido real.</p>
  <div class="card" id="feeCard" hidden></div>
  <div class="card" id="payCard" hidden></div>
  <div class="card" id="pixCard" hidden></div>
  <div class="card" id="stepsCard" hidden><h2>Andamento</h2><ol class="steps" id="steps"></ol></div>
  <div class="card" id="itemsCard" hidden></div>
  <div class="card" id="helpCard">
    <p class="muted" style="font-size:15px">Dúvidas sobre o pedido? Fale com o Léo pelo WhatsApp <b class="num" style="color:var(--carvao)">(51) 99620-0841</b>.</p>
    <a class="btn" href="https://wa.me/5551996200841" target="_blank" rel="noopener">Falar no WhatsApp</a>
    <a class="btn" href="/">Voltar ao cardápio</a>
  </div>
  <p class="muted" style="font-size:13.5px;text-align:center" id="updated"></p>
</div></main>

<script src="js/qr.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});function money(c){return c==null?'a combinar':BRL.format(c/100)}
var fmtTime=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
var qs=new URLSearchParams(location.search),id=qs.get('id'),token=qs.get('t');
var DEMO=false,order=null,demoOrder=null;

async function api(path,body,method){
  if(DEMO)return demoApi(path,body,method);
  var r=await fetch('/api/'+path,{method:method||(body?'POST':'GET'),cache:'no-store',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  var d;try{d=await r.json()}catch(e){var x=Error('O servidor não respondeu. Tente novamente.');x.noJson=true;throw x}
  if(!r.ok){var e2=Error(d.error||'Não foi possível carregar o pedido.');e2.status=r.status;throw e2}return d;
}
function pathFor(){return 'orders/'+encodeURIComponent(id)+(token?'?token='+encodeURIComponent(token):'')}

var titles={received:'Pedido recebido',preparing:'Em preparo',ready:'Pronto!',out_for_delivery:'Saiu para entrega',completed:'Pedido concluído',cancelled:'Pedido cancelado'};
function subtitle(o){var s=o.snapshot;return {received:'O Léo já recebeu seu pedido e vai começar em instantes.',preparing:'Seu pedido está na chapa.',ready:s.mode==='delivery'?'Pronto e aguardando o entregador.':s.mode==='dine_in'?'Já vamos servir'+(s.table?' na mesa '+s.table:' você')+'.':'Pode vir buscar no balcão: Av. Visconde do Rio Grande, 1451.',out_for_delivery:'O entregador está a caminho.',completed:'Bom apetite! Obrigado por pedir no Léo.',cancelled:'Se tiver dúvidas, fale com o restaurante pelo WhatsApp.'}[o.status]}

function render(){
  var o=order,s=o.snapshot;
  document.title='Pedido '+o.number+' · '+titles[o.status];
  $('kicker').textContent='Pedido '+o.number+' · feito às '+fmtTime.format(new Date(o.created));
  $('title').textContent=titles[o.status];$('subtitle').textContent=subtitle(o);
  if(o.proof&&o.status==='received'&&o.payment==='review'){$('title').textContent='Aguardando confirmação';$('subtitle').textContent='Assim que o Léo confirmar o Pix, teu pedido entra em preparo.'}
  if(o.proof&&o.status==='received'&&o.payment==='rejected'){$('title').textContent='Pagamento recusado';$('subtitle').textContent='Fale com o Léo pelo WhatsApp para resolver.'}
  // almoço agendado: hora que o cliente escolheu
  var lt=s.lunch&&s.lunch.time,lw=$('lunchWhen');
  if(lt&&['completed','cancelled'].indexOf(o.status)<0){lw.hidden=false;lw.innerHTML='Teu almoço será <b>'+(s.mode==='delivery'?'entregue':s.mode==='dine_in'?'servido':'retirado')+'</b> '+(lt==='asap'?'o quanto antes, a partir das 11:30':'às <b>'+esc(lt)+'</b>')+'.'}else lw.hidden=true;
  // frete a aceitar
  var fc=$('feeCard');
  if(false){fc.hidden=false; // frete não precisa mais de aceite do cliente
    fc.innerHTML=o.fee==null?'<h2>Taxa de entrega</h2><p class="note">O Léo vai informar a taxa de entrega em instantes. Esta página atualiza sozinha.</p>':
      '<h2>Confirme a taxa de entrega</h2><p>Entrega para <b>'+esc(s.neighborhood)+'</b>: <b class="num">'+money(o.fee)+'</b>.</p><p>Total do pedido: <b class="num">'+money(s.subtotal+o.fee)+'</b></p><button class="btn btn-primary" id="acceptFee">Aceitar e liberar o preparo</button><p class="err" id="feeErr" role="alert"></p>';
    var b=$('acceptFee');if(b)b.onclick=acceptFee;
  }else fc.hidden=true;
  renderPix();
  /* Pix com comprovante enviado pelo site */
  var pc=$('payCard');
  if(o.proof&&o.status!=='cancelled'&&(o.payment==='review'||o.payment==='rejected')){pc.hidden=false;
    pc.innerHTML=o.payment==='review'?'<h2>Comprovante recebido</h2><p class="okmsg">Recebemos teu comprovante! Assim que o pagamento for confirmado, teu pedido entra em preparo.</p><p class="muted" style="font-size:14px">Status: Aguardando confirmação do pagamento. Esta página atualiza sozinha.</p>':
      '<h2>Pagamento recusado</h2><p class="note">O Léo não conseguiu confirmar o teu Pix'+(o.payReason?': '+esc(o.payReason):'')+'.</p><a class="btn btn-primary" href="https://wa.me/5551996200841?text='+encodeURIComponent('Olá! Meu Pix do pedido '+o.number+' foi recusado. Pode me ajudar?')+'" target="_blank" rel="noopener">Falar com o Léo no WhatsApp</a>'}
  else pc.hidden=true;
  // etapas
  var flow=s.mode==='delivery'?['received','preparing','ready','out_for_delivery','completed']:['received','preparing','ready','completed'];
  var names={received:'Recebido',preparing:'Em preparo',ready:s.mode==='delivery'?'Pronto':s.mode==='dine_in'?'Pronto para servir':'Pronto para retirar',out_for_delivery:'Saiu para entrega',completed:s.mode==='delivery'?'Entregue':s.mode==='dine_in'?'Servido':'Retirado'};
  if(o.status==='cancelled'){$('stepsCard').hidden=false;$('steps').innerHTML='<li class="now"><span class="dot">×</span><span><b>Cancelado</b><small>Este pedido foi cancelado pelo restaurante.'+(o.cancelReason?' Motivo: '+esc(o.cancelReason)+'.':'')+'</small></span></li>'}
  else{var at=flow.indexOf(o.status);$('stepsCard').hidden=false;
    $('steps').innerHTML=flow.map(function(k,i){var c=i<at||o.status==='completed'?'done':i===at?'now':'todo';return '<li class="'+c+'"><span class="dot">'+(c==='done'?'✓':'')+'</span><span><b>'+names[k]+'</b>'+(c==='now'&&k!=='completed'?'<small>agora</small>':'')+'</span></li>'}).join('')}
  // itens
  $('itemsCard').hidden=false;
  $('itemsCard').innerHTML='<h2>Itens</h2>'+s.lines.map(function(l){return '<div class="line"><b>'+l.qty+'× '+esc(l.name)+'</b><span class="num">'+money(l.total)+'</span>'+(l.extras&&l.extras.length?'<small>+ '+l.extras.map(function(x){return esc(x.name)}).join(', ')+'</small>':'')+(l.note?'<small>'+esc(l.note)+'</small>':'')+'</div>'}).join('')+
    '<div class="totals" style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px"><div><span>Produtos</span><span>'+money(s.subtotal)+'</span></div>'+(s.mode==='delivery'?'<div><span>Entrega</span><span>'+money(o.fee)+'</span></div>':'')+
    '<div class="big"><span>Total</span><span>'+(s.mode==='delivery'&&o.fee==null?money(s.subtotal)+' + entrega':money(s.subtotal+(o.fee||0)))+'</span></div></div>'+
    '<p class="muted" style="font-size:14px">'+(s.mode==='delivery'?'Entrega: '+(s.addr&&s.addr.street?esc(s.addr.street)+', <b>'+esc(s.addr.number)+'</b>'+(s.addr.complement?' - '+esc(s.addr.complement):'')+' - '+esc(s.neighborhood)+(s.addr.reference?'<br>Ref.: '+esc(s.addr.reference):''):esc(s.address)+' — '+esc(s.neighborhood)):s.mode==='dine_in'?'Comer no restaurante'+(s.table?' · Mesa '+esc(s.table):''):'Retirar no balcão (para levar): Av. Visconde do Rio Grande, 1451, Centro')+'<br>'+esc(s.customer.name)+' · '+esc(s.customer.phone)+'</p>'+
    (o.payment==='approved'?'<p class="okmsg">Pagamento confirmado</p>':'');
  $('updated').textContent=['completed','cancelled'].indexOf(o.status)>-1?'':'Esta página atualiza sozinha · '+fmtTime.format(new Date());
}
/* ===== Pix copia e cola (padrão BR Code do Banco Central). A chave vem do painel (Funcionamento > Pix).
   O pagamento cai direto na conta do Léo; ele confere e marca "Pago" no painel. ===== */
var pix=null,pixLoaded=false;
function emv(id,v){return id+String(v.length).padStart(2,'0')+v}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function plain(s,n){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim().slice(0,n)}
function pixCode(cents,txid){
  var p=emv('00','01')+emv('26',emv('00','br.gov.bcb.pix')+emv('01',pix.key))+emv('52','0000')+emv('53','986')+emv('54',(cents/100).toFixed(2))+emv('58','BR')+
    emv('59',plain(pix.name,25)||'LEO RESTAURANTE')+emv('60',plain(pix.city,15)||'BARRA DO RIBEIRO')+emv('62',emv('05',plain(txid,25).replace(/ /g,'')||'***'))+'6304';
  return p+crc16(p);
}
function renderPix(){
  var o=order,s=o.snapshot,c=$('pixCard');
  var wantsPix=/Pagamento: Pix/.test(s.notes||''),known=s.mode!=='delivery'||o.fee!=null;
  if(!wantsPix||o.payment!=='pending'||o.status==='cancelled'||!known){c.hidden=true;delete c.dataset.code;return}
  /* cliente escolheu Pix, mas o restaurante ainda não cadastrou a chave no painel */
  if(!pix||!pix.key){if(!pixLoaded){c.hidden=true;return}
    if(c.dataset.code==='sem-chave')return;c.dataset.code='sem-chave';c.hidden=false;
    c.innerHTML='<h2>Pagamento com Pix</h2><p class="note">O Léo vai te passar a chave Pix pelo WhatsApp. Se preferir, chame agora.</p><a class="btn btn-primary" href="https://wa.me/5551996200841?text='+encodeURIComponent('Olá! Quero pagar o pedido '+o.number+' com Pix. Qual é a chave?')+'" target="_blank" rel="noopener">Pedir a chave Pix no WhatsApp</a>';return}
  var cents=s.subtotal+(o.fee||0),code=pixCode(cents,'PEDIDO'+String(o.number).replace(/\D/g,''));
  if(c.dataset.code===code&&!c.hidden)return;
  c.dataset.code=code;c.hidden=false;
  var qr='';try{qr='<div class="pixqr">'+qrSvg(code,'QR code Pix de '+money(cents))+'</div>'}catch(e){}
  c.innerHTML='<h2>Pague com Pix</h2><p class="muted">'+(qr?'Escaneie o QR code no app do seu banco ou copie o código abaixo e cole em ':'Copie o código e cole no app do seu banco, em ')+'<b style="color:var(--carvao)">Pix copia e cola</b>. O valor já vem preenchido.</p>'+
    '<p class="pixamount num">'+money(cents)+'</p>'+qr+'<div class="pixcode" id="pixCode">'+esc(code)+'</div>'+
    '<button class="btn btn-primary" id="pixCopy">Copiar código Pix</button>'+
    '<p class="muted" style="font-size:14px">Depois de pagar, o Léo confirma e esta página mostra "Pagamento confirmado". Se preferir, mande o comprovante no WhatsApp.</p>';
  $('pixCopy').onclick=function(){var b=this;function ok(){b.textContent='Código copiado ✓';setTimeout(function(){b.textContent='Copiar código Pix'},2500)}
    function sel(){var r=document.createRange();r.selectNodeContents($('pixCode'));var g=getSelection();g.removeAllRanges();g.addRange(r);b.textContent='Código selecionado: copie'}
    try{navigator.clipboard.writeText(code).then(ok,sel)}catch(e){sel()}};
}
async function loadPix(){try{var c=DEMO?{pix:{key:'+5551996200841',name:'Leo Restaurante',city:'Barra do Ribeiro'}}:await api('catalog');pix=c.pix&&c.pix.key?c.pix:null;pixLoaded=true;if(order)render()}catch(e){}}
async function load(){
  try{order=await api(pathFor());render()}
  catch(e){
    if(!order){$('title').textContent=e.status===401||e.status===403||e.status===404?'Pedido não encontrado':'Não foi possível abrir';$('subtitle').textContent=e.status===401||e.status===403||e.status===404?'Confira se abriu o link completo que apareceu depois do pedido. Se precisar, fale com o Léo pelo WhatsApp.':e.message}
    else $('updated').textContent='Sem conexão agora. Tentando de novo…';
  }
}
async function acceptFee(){
  var b=$('acceptFee');b.disabled=true;b.textContent='Confirmando…';
  try{order=await api('orders/'+encodeURIComponent(id),{action:'accept_fee',version:order.version,token:token},'PATCH');render()}
  catch(e){$('feeErr').textContent=e.message;b.disabled=false;b.textContent='Aceitar e liberar o preparo';load()}
}

/* demonstração: fora do domínio do restaurante e sem servidor */
function demoApi(path,body,method){
  if(!demoOrder){demoOrder={id:'demo',number:'#1048',created:new Date(Date.now()-4*60000).toISOString(),status:'received',payment:'pending',fee:600,fee_approved:false,version:1,
    snapshot:{customer:{name:'Mariana',phone:'(51) 99812-4410'},mode:'delivery',address:'Rua General Osório, 210',neighborhood:'Centro',notes:'Pagamento: Pix',subtotal:7900,
      lines:[{name:'X Coração',qty:2,total:6000,extras:[],note:'Sem ervilha'},{name:'Refrigerante 2 Litros',qty:1,total:1800,extras:[],note:''}]}}}
  if(method==='PATCH'){demoOrder.fee_approved=true;demoOrder.version++;var o=demoOrder;
    setTimeout(function(){o.status='preparing';o.version++},5000);setTimeout(function(){o.status='ready';o.version++},12000);setTimeout(function(){o.status='out_for_delivery';o.version++},20000)}
  return Promise.resolve(JSON.parse(JSON.stringify(demoOrder)));
}

(async function(){
  if(!id&&/restaurantexleo\.com\.br$/.test(location.hostname)){$('title').textContent='Pedido não encontrado';$('subtitle').textContent='Abra o link que apareceu depois de fazer o pedido.';return}
  if(!id){DEMO=true}
  else{try{order=await api(pathFor());render()}catch(e){if(e.noJson&&!/restaurantexleo\.com\.br$/.test(location.hostname))DEMO=true;else{order=null;await load();return}}}
  if(DEMO){$('demo').hidden=false;order=await api('x');render()}
  loadPix();
  setInterval(function(){if(!document.hidden&&order&&['completed','cancelled'].indexOf(order.status)<0)(DEMO?api('x').then(function(o){order=o;render()}):load())},DEMO?3000:15000);
})();
})();
</script>

</body></html>
